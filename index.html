    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LOKIN AI" />

    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>LOKIN AI — Lock In. Make More.</title>
  </head>
  <body>
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var ios = ua.match(/OS (\d+)[._]/);
        var isLegacyIOS = /iPad|iPhone|iPod/.test(ua) && ios && parseInt(ios[1], 10) <= 12;
        if (isLegacyIOS) {
          window.location.replace('/legacy.html' + window.location.search + window.location.hash);
        }
      }());
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
